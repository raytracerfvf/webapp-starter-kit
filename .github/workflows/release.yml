name: Release

run-name: "Release ${{ inputs.environment }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment (holds the Railway secrets/vars)
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read
  # Read workflow runs so the deploy can require a green CI on the exact SHA.
  actions: read

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require main for production
        if: inputs.environment == 'production'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Production releases must be dispatched from main, not $RELEASE_REF."
            exit 1
          fi
      - name: Require green CI on the deployed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$SHA" \
            --workflow ci.yml \
            --status completed \
            --json conclusion \
            --jq 'map(select(.conclusion == "success")) | length')
          if [[ "$conclusion" -lt 1 ]]; then
            echo "No successful CI run found for $SHA."
            echo "Wait for CI to pass on this commit (or investigate its failure) before releasing."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # The workspace only needs node_modules for db:migrate:deploy; skip
      # codegen postinstall work.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: bash .github/scripts/railway-deploy.sh
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      - name: Smoke-test deployment
        if: vars.PUBLIC_ORIGIN != ''
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 6 --retry-all-errors \
            "$PUBLIC_ORIGIN/api/health" \
            | jq --exit-status '.status == "ok"'
