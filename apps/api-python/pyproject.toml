[project]
name = "api-service"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "asyncpg>=0.30",
  "fastapi[standard]>=0.141.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.8",
  "sqlalchemy>=2",
  "structlog>=25",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio>=1.0",
  "ruff==0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
reportUnknownMemberType = false
reportUnknownVariableType = false
